name: Release Launcher

# Triggered by pushing a version tag (v1.2.0, v1.3.0, ...) or manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to build, e.g. v1.3.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${{ inputs.version }}"
          else
            value="${GITHUB_REF_NAME}"
          fi
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Building for ${value}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install regression dependencies
        run: python -m pip install --quiet -r requirements-dev.txt

      # Includes bootstrap, old-version migrations, both builders, native EXE,
      # update/rollback, configuration transactions and Agent confirmations.
      - name: Run complete Windows regression suite
        run: |
          python -m pytest -q --basetemp .runtime/pytest-release \
            --junitxml=.runtime/test-results/launcher-release.xml

      - name: JavaScript syntax check
        run: node --check web/app.js

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-regression-report
          path: .runtime/test-results/launcher-release.xml
          if-no-files-found: ignore

      # Builds launcher-<version>.zip + launcher-manifest.json and fails when the
      # tag does not match LAUNCHER_VERSION in 统一启动器.py.
      - name: Build release assets
        run: |
          python scripts/build_launcher_release.py \
            --version "${{ steps.version.outputs.value }}" \
            --require-version-match \
            --out dist

      # Builds the full first-run package used by new users.  It contains the
      # launcher, scripts, local Autovisor sources, Yatori assets and bootstrap.
      # Optional repository variables YATORI_CORE_URL / YATORI_CORE_SHA256 /
      # YATORI_CORE_SIZE / YATORI_CORE_VERSION are written into the manifest so
      # the bootstrap downloads the project-owned Yatori release asset.
      - name: Build full release package
        env:
          YATORI_CORE_URL: ${{ vars.YATORI_CORE_URL }}
          YATORI_CORE_SHA256: ${{ vars.YATORI_CORE_SHA256 }}
          YATORI_CORE_SIZE: ${{ vars.YATORI_CORE_SIZE }}
          YATORI_CORE_VERSION: ${{ vars.YATORI_CORE_VERSION }}
        run: |
          extra=()
          if [ -n "$YATORI_CORE_URL" ]; then
            extra+=(--yatori-core-url "$YATORI_CORE_URL")
          fi
          if [ -n "$YATORI_CORE_SHA256" ]; then
            extra+=(--yatori-core-sha256 "$YATORI_CORE_SHA256")
          fi
          if [ -n "$YATORI_CORE_SIZE" ]; then
            extra+=(--yatori-core-size "$YATORI_CORE_SIZE")
          fi
          if [ -n "$YATORI_CORE_VERSION" ]; then
            extra+=(--yatori-core-version "$YATORI_CORE_VERSION")
          fi
          python scripts/build_full_release.py \
            --version "${{ steps.version.outputs.value }}" \
            --require-version-match \
            --out dist \
            "${extra[@]}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.value }}"
          if [ -f "docs/releases/$tag.md" ]; then
            notes=(--notes-file "docs/releases/$tag.md")
          else
            notes=(--generate-notes)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; uploading assets and updating notes."
            gh release upload "$tag" dist/*.zip dist/launcher-manifest.json dist/full-manifest.json --clobber
            gh release edit "$tag" --title "统一启动器 $tag" "${notes[@]}"
          else
            gh release create "$tag" \
              dist/*.zip dist/launcher-manifest.json dist/full-manifest.json \
              --title "统一启动器 $tag" \
              "${notes[@]}"
          fi
